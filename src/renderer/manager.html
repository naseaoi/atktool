<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src ipc: http://ipc.localhost; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATK 设备管理</title>
    <link rel="stylesheet" href="./manager.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device card" aria-labelledby="deviceName">
        <header class="device__head">
          <h1 id="deviceName" class="device__name">未绑定设备</h1>
          <span id="statusChip" class="chip" data-kind="neutral" data-icon="dot">
            <svg class="chip__icon chip__icon--bolt" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z" />
            </svg>
            <svg class="chip__icon chip__icon--plug" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5" />
            </svg>
            <svg class="chip__icon chip__icon--alert" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8v5M12 16.5v.01M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0z" />
            </svg>
            <span class="chip__dot" aria-hidden="true"></span>
            <span id="statusChipText">连接中</span>
          </span>
        </header>

        <div class="device__main">
          <div class="reading">
            <span id="batteryValue" class="reading__value">--</span>
            <span class="reading__unit">%</span>
          </div>
          <div class="device__gauge">
            <div id="batteryMeter" class="meter" role="progressbar" aria-label="电量" aria-valuemin="0" aria-valuemax="100">
              <div class="meter__fill"></div>
            </div>
            <p id="detailText" class="device__detail"></p>
          </div>
        </div>

        <dl class="facts">
          <div>
            <dt>采集方式</dt>
            <dd id="modeText">本地 HID 直连</dd>
          </div>
          <div>
            <dt>协议</dt>
            <dd id="protocolText">--</dd>
          </div>
          <div>
            <dt>已授权</dt>
            <dd id="grantedCount">0</dd>
          </div>
          <div>
            <dt>最近更新</dt>
            <dd id="updatedAt">--</dd>
          </div>
        </dl>

        <div class="actions">
          <button id="authorizeButton" class="button button--primary" type="button">选择并绑定设备</button>
          <button id="refreshButton" class="button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
            刷新
          </button>
          <button id="fallbackButton" class="button" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3.5 9h17M3.5 15h17M12 3c2.5 2.6 3.5 5.6 3.5 9s-1 6.4-3.5 9c-2.5-2.6-3.5-5.6-3.5-9s1-6.4 3.5-9z" /></svg>
            <span id="fallbackLabel">同步官网电量</span>
          </button>
          <button id="unbindButton" class="button button--quiet button--danger" type="button">解绑</button>
        </div>
      </section>

      <section class="settings">
        <div class="group card" role="group" aria-labelledby="overlayGroupTitle">
          <h2 id="overlayGroupTitle" class="group__title">悬浮窗</h2>
          <div class="row">
            <span id="variantLabel" class="row__label">形态</span>
            <div class="segmented" role="group" aria-labelledby="variantLabel">
              <button type="button" data-variant="full">完整版</button>
              <button type="button" data-variant="compact">简略版</button>
            </div>
          </div>
          <div class="row">
            <span id="sizeLabel" class="row__label">尺寸</span>
            <div class="segmented" role="group" aria-labelledby="sizeLabel">
              <button type="button" data-size="small">小</button>
              <button type="button" data-size="medium">中</button>
              <button type="button" data-size="large">大</button>
            </div>
          </div>
          <label class="row">
            <span class="row__label">不透明度</span>
            <span class="slider">
              <input id="overlayOpacity" type="range" min="40" max="100" step="5" value="100" />
              <output id="opacityValue" for="overlayOpacity">100%</output>
            </span>
          </label>
          <button class="row row--toggle" type="button" data-pref="smartDisplay" aria-pressed="false" title="仅在电量不高于 20% 或充电时显示悬浮窗">
            <span class="row__label">智能显示<small>仅低电量或充电时出现</small></span>
            <span class="switch" aria-hidden="true"></span>
          </button>
        </div>

        <div class="group card" role="group" aria-labelledby="generalGroupTitle">
          <h2 id="generalGroupTitle" class="group__title">通用</h2>
          <button id="startupToggle" class="row row--toggle" type="button" aria-pressed="false">
            <span class="row__label">开机启动</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button class="row row--toggle" type="button" data-pref="lowBatteryNotify" aria-pressed="false">
            <span class="row__label">低电量提醒<small>20% 与 10% 时通知</small></span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button class="row row--toggle" type="button" data-pref="hideInFullscreen" aria-pressed="false">
            <span class="row__label">全屏时隐藏</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button class="row row--toggle" type="button" data-pref="edgeAutoHide" aria-pressed="false">
            <span class="row__label">贴边自动隐藏<small>拖到屏幕边缘后收起</small></span>
            <span class="switch" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <p id="settingsError" class="settings-error" role="alert" hidden></p>
    </main>

    <div id="hidPickerBackdrop" class="dialog-backdrop" hidden>
      <section class="dialog card" role="dialog" aria-modal="true" aria-labelledby="hidPickerTitle">
        <header class="dialog__head">
          <h2 id="hidPickerTitle">选择 HID 设备</h2>
          <p id="hidPickerHint" class="dialog__hint"></p>
        </header>

        <p id="hidPickerEmpty" class="dialog__empty" hidden>
          没有找到可用的 HID 设备。确认鼠标使用 2.4G 接收器或有线连接后，保持此窗口打开并重新插拔。
        </p>

        <div id="hidPickerList" class="picker"></div>

        <footer class="dialog__actions">
          <button id="hidPickerCancelButton" class="button" type="button">取消</button>
          <button id="hidPickerConfirmButton" class="button button--primary" type="button">绑定</button>
        </footer>
      </section>
    </div>

    <script src="./runtime-bridge.js"></script>
    <script src="./hid-shared.js"></script>
    <script src="./battery-view.js"></script>
    <script type="module" src="./manager.js"></script>
  </body>
</html>
