<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src ipc: http://ipc.localhost; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATK 电量悬浮窗</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <main id="panel" class="panel">
      <section id="card" class="card">
        <div class="full">
          <header class="full__head">
            <span id="deviceName" class="full__name">等待连接</span>
            <button id="menuButton" class="menu-button" type="button" aria-label="更多操作" title="更多操作">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="5" cy="12" r="1.6" />
                <circle cx="12" cy="12" r="1.6" />
                <circle cx="19" cy="12" r="1.6" />
              </svg>
            </button>
          </header>

          <div class="full__main">
            <div class="reading">
              <span id="batteryValue" class="reading__value">--</span>
              <span class="reading__unit">%</span>
            </div>
            <span id="statusChip" class="chip" hidden>
              <svg class="chip__icon chip__icon--bolt" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z" />
              </svg>
              <svg class="chip__icon chip__icon--plug" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5" />
              </svg>
              <svg class="chip__icon chip__icon--alert" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 8v5M12 16.5v.01M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0z" />
              </svg>
              <span class="chip__dot" aria-hidden="true"></span>
              <span id="statusChipText"></span>
            </span>
          </div>

          <div id="batteryMeter" class="meter" role="progressbar" aria-label="电量" aria-valuemin="0" aria-valuemax="100">
            <div class="meter__fill"></div>
          </div>

          <footer class="full__foot">
            <span id="detailText" class="full__detail"></span>
            <button id="managerButton" class="link-button" type="button" hidden>设备管理</button>
          </footer>
        </div>

        <div class="capsule" aria-hidden="true">
          <svg class="capsule__glyph" viewBox="0 0 24 12">
            <rect class="capsule__shell" x="0.75" y="0.75" width="20" height="10.5" rx="3" />
            <rect class="capsule__nub" x="21.6" y="4" width="1.8" height="4" rx="0.9" />
            <rect id="capsuleFill" class="capsule__fill" x="2.5" y="2.5" width="0" height="7" rx="1.5" />
            <path class="capsule__bolt" d="M11.6 1.6 7.6 6.6h2.9l-.9 3.8 4-5H10.7l.9-3.8z" />
          </svg>
          <span id="capsuleValue" class="capsule__value">--</span>
        </div>
      </section>
    </main>

    <script src="./runtime-bridge.js"></script>
    <script src="./battery-view.js"></script>
    <script src="./overlay.js"></script>
  </body>
</html>
